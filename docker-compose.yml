services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: budgetboard
      POSTGRES_USER: budgetboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
    volumes:
      - openbudget-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgetboard -d budgetboard"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__budgetdatabase: Host=postgres;Port=5432;Database=budgetboard;Username=budgetboard;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
      BootstrapAdmin__Username: ${BootstrapAdmin__Username:?Set BootstrapAdmin__Username in Coolify}
      BootstrapAdmin__Email: ${BootstrapAdmin__Email:?Set BootstrapAdmin__Email in Coolify}
      BootstrapAdmin__Password: ${BootstrapAdmin__Password:?Set BootstrapAdmin__Password in Coolify}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  openbudget-data:

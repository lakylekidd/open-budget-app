name: Build and test

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/OpenBudget.UI/package-lock.json
      - run: dotnet restore OpenBudget.slnx
      - run: npm --prefix src/OpenBudget.UI ci
      - run: dotnet build OpenBudget.slnx --no-restore
      - run: dotnet test OpenBudget.slnx --no-build --logger trx
      - run: npm --prefix src/OpenBudget.UI test
      - run: npm --prefix src/OpenBudget.UI run build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: '**/TestResults/*.trx'

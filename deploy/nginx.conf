map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # MCP Streamable HTTP for personal agent tokens (bearer only; see docs/mcp.md).
    location = /mcp {
        proxy_pass http://api:8080/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
        client_max_body_size 1m;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /health {
        proxy_pass http://api:8080/health;
    }

    # API-owned paths that the exact/prefix proxies above do not match must 404, never fall back to the SPA.
    location = /api {
        return 404;
    }

    location ^~ /mcp/ {
        return 404;
    }

    location ^~ /health/ {
        return 404;
    }

    # Client-side routes (/{budgetKey}/plan, /{budgetKey}/account/{slug}, /admin, /login, ...) load index.html;
    # existing files such as /assets/*.js are served directly. See docs/architecture.md "URL routing".
    location / {
        try_files $uri $uri/ /index.html;
    }
}
